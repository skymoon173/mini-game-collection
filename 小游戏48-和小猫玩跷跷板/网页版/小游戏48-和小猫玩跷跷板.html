<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Seesaw Game</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, seesaw, pivot, player, cat;
        let seesawAngle = 0;
        let seesawSpeed = 0;
        const gravity = 9.81;

        function init() {
            // 创建场景
            scene = new THREE.Scene();

            // 创建摄像机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 50);
            camera.lookAt(0, 0, 0);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 创建地面
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // 创建跷跷板
            const seesawGeometry = new THREE.BoxGeometry(20, 1, 1);
            const seesawMaterial = new THREE.MeshBasicMaterial({ color: 0x8B4513 });
            seesaw = new THREE.Mesh(seesawGeometry, seesawMaterial);
            seesaw.position.y = 1;
            scene.add(seesaw);

            // 创建支点
            const pivotGeometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
            const pivotMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
            pivot = new THREE.Mesh(pivotGeometry, pivotMaterial);
            pivot.position.y = 1;
            scene.add(pivot);

            // 创建玩家
            const playerGeometry = new THREE.SphereGeometry(1, 32, 32);
            const playerMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.set(-5, 2, 0);
            player.mass = 5;
            scene.add(player);

            // 创建小猫
            const catGeometry = new THREE.SphereGeometry(1, 32, 32);
            const catMaterial = new THREE.MeshBasicMaterial({ color: 0x0000ff });
            cat = new THREE.Mesh(catGeometry, catMaterial);
            cat.position.set(5, 2, 0);
            cat.mass = 5;
            scene.add(cat);

            // 添加事件监听
            document.addEventListener('keydown', onDocumentKeyDown, false);

            animate();
        }

        function onDocumentKeyDown(event) {
            const keyCode = event.which;
            if (keyCode == 37) { // 左箭头
                player.position.x -= 0.5;
            } else if (keyCode == 39) { // 右箭头
                player.position.x += 0.5;
            } else if (keyCode == 65) { // A 键
                cat.position.x -= 0.5;
            } else if (keyCode == 68) { // D 键
                cat.position.x += 0.5;
            } else if (keyCode == 87) { // W 键增加小猫重量
                cat.mass += 1;
            } else if (keyCode == 83) { // S 键减小小猫重量
                cat.mass = Math.max(1, cat.mass - 1);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // 简单的物理模拟
            const playerWeight = player.mass;
            const catWeight = cat.mass;
            const seesawTorque = (cat.position.x * catWeight - player.position.x * playerWeight) * gravity;

            seesawSpeed += seesawTorque * 0.0001;  // 控制跷跷板的旋转速度
            seesawSpeed *= 0.99;  // 模拟阻尼
            seesawAngle += seesawSpeed;

            seesawAngle = Math.max(Math.min(seesawAngle, Math.PI / 6), -Math.PI / 6);  // 限制跷跷板的旋转角度

            seesaw.rotation.z = seesawAngle;

            // 胜利条件检查
            if (seesawAngle > 0.5) {
                alert("小猫胜利了！");
                resetGame();
            } else if (seesawAngle < -0.5) {
                alert("玩家胜利了！");
                resetGame();
            }

            renderer.render(scene, camera);
        }

        function resetGame() {
            seesawAngle = 0;
            seesawSpeed = 0;
            player.position.set(-5, 2, 0);
            player.mass = 5;
            cat.position.set(5, 2, 0);
            cat.mass = 5;
            seesaw.rotation.z = seesawAngle;
        }

        window.onload = init;
    </script>
</body>
</html>
